<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0e1013">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex, nofollow">
<title>노래 연습</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preload" href="fonts/PretendardVariable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app"><div class="loading"><div class="spinner"></div><p>여는 중…</p></div></main>
<noscript>이 앱은 자바스크립트가 켜져 있어야 합니다.</noscript>
<script>
// 앱이 10초 안에 안 열리면(새 판·옛 판 파일이 섞여 열기에 실패 등 — 11-14 점검) 고칠 단추를 보인다.
// 단추는 저장해 둔 앱 파일만 지우고 새로 받는다. 곡·점수(IndexedDB)는 지우지 않는다.
setTimeout(function () {
  if (window.__noraeStarted) return;
  var a = document.getElementById('app');
  a.innerHTML = '<div class="loading"><p>앱이 열리지 않습니다.</p><p class="hint">인터넷이 되는 곳에서 아래 단추를 누르세요. 곡은 지워지지 않습니다.</p><button class="primary" id="fix-app">새로 받아 다시 열기</button></div>';
  document.getElementById('fix-app').onclick = function () {
    var done = function () { location.reload(); };
    try { caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }).then(done, done); } catch (e) { done(); }
  };
}, 10000);
// 새 판을 뒤에서 다 받았으면(sw.js 가 알림 — 11-22) 잠깐 알린다. 지금 화면은 그대로 두고 다음에 열 때 바뀐다.
try {
  if ('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message', function (ev) {
    if (!ev.data || ev.data.type !== 'norae-new-version') return;
    var t = document.getElementById('toast');
    if (!t) { t = document.createElement('div'); t.id = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
    t.textContent = '새 판을 받았습니다 — 앱을 다시 열면 바뀝니다';
    t.classList.add('show');
    clearTimeout(t._h);
    t._h = setTimeout(function () { t.classList.remove('show'); }, 5000);
  });
} catch (e) { console.warn('새 판 알림 받기 준비 실패', e); }
</script>
<script src="js/vendor/vexflow-bravura.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
